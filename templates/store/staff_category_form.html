{% extends "base.html" %}
{% load static %}

{% block content %}

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    /* --- GLOBAL VARIABLES & RESET --- */
    :root {
        --primary: #2152ff;
        --text-dark: #344767;
        --text-gray: #8392ab;
        --bg-body: #f5f7fb;
        /* MÀU NHẤN CHỦ ĐẠO */
        --accent-gradient: linear-gradient(310deg, var(--primary) 0%, #21d4fd 100%);
        --accent-color: var(--primary);
    }
    body { font-family: 'Poppins', sans-serif; color: var(--text-dark); background-color: var(--bg-body); }

    /* --- ANIMATIONS --- */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }

    /* --- CARD STYLING --- */
    .card {
        border: none;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 0.75rem 1.5rem rgba(18, 38, 63, 0.03);
        transition: 0.3s ease;
        overflow: hidden;
    }

    /* === HEADER BANNER (Áp dụng từ form Add Product) === */
    .form-header-banner {
        background: var(--accent-gradient);
        color: white;
        padding: 20px 30px; /* Làm nhỏ padding */
        border-top-left-radius: 20px;
        border-top-right-radius: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .form-header-banner h4 {
        margin-bottom: 0;
        font-weight: 700;
        z-index: 2;
        font-size: 1.5rem;
    }
    .btn-back-coupon {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 10px;
        padding: 8px 15px;
        font-weight: 600;
        transition: 0.2s;
    }
    .btn-back-coupon:hover {
        background: rgba(255, 255, 255, 0.3);
        color: white;
    }

    /* --- FORM & INPUT STYLING --- */
    label {
        font-weight: 600;
        margin-top: 0;
        display: block;
    }
    .form-control {
        border-radius: 10px;
        border: 1px solid #e9ecef;
        padding: 12px 15px;
        box-shadow: none;
        transition: 0.3s;
        font-weight: 500;
    }
    .form-control:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(33, 82, 255, 0.1);
    }

    /* === BUTTON STYLING (SAVE) === */
    .btn-gradient-primary {
        background: var(--accent-gradient);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        font-weight: 600;
        box-shadow: 0 4px 7px rgba(33, 82, 255, 0.3);
        transition: 0.3s;
        text-transform: uppercase;
    }
    .btn-gradient-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(33, 82, 255, 0.4);
        color: white;
    }

    /* --- BUTTON STYLING (CANCEL) --- */
    .btn-secondary-flat {
        border-radius: 10px;
        font-weight: 600;
        padding: 10px 20px;
        border: 1px solid #dfe4ea;
        background-color: #f5f7fb;
        color: var(--text-dark);
        transition: 0.2s;
    }
    .btn-secondary-flat:hover {
        background-color: #e9ecef;
    }

</style>


<section class="section-content padding-y" style="background-color: var(--bg-body); min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">

            <main class="col-md-9 animate-up delay-2">

                <article class="card p-0">

                    <div class="form-header-banner">
                        <h4>
                            {% if category %}
                                Edit Category
                            {% else %}
                                Add Category
                            {% endif %}
                        </h4>
                        <a href="{% url 'staff_category_list' %}" class="btn-back-coupon">
                            ← Back
                        </a>
                    </div>

                    <div class="card-body p-4">

                        <form action="" method="POST">
                            {% csrf_token %}

                            <div class="form-group mb-4">
                                <label class="font-weight-bold mb-2" for="name">Category Name:</label>
                                <input type="text"
                                       name="name"
                                       id="name"
                                       class="form-control"
                                       placeholder="E.g., Jacket"
                                       value="{{ category.category_name|default:'' }}"
                                       required>
                            </div>

                            <div class="form-group mb-4">
                                <label class="font-weight-bold mb-2" for="slug">Slug:</label>
                                <input type="text"
                                       name="slug"
                                       id="slug"
                                       class="form-control"
                                       placeholder="E.g., jacket"
                                       value="{{ category.slug|default:'' }}"
                                       required>
                                <small class="form-text text-muted">The slug is the URL path. Use lowercase, no spaces.</small>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-start">
                                <button type="submit" class="btn btn-gradient-primary mr-3">
                                    SAVE
                                </button>

                                <a href="{% url 'staff_category_list' %}" class="btn btn-secondary-flat">
                                    CANCEL
                                </a>
                            </div>

                        </form>

                    </div>
                </article>

            </main>
        </div>
    </div>
</section>

{% endblock %}
